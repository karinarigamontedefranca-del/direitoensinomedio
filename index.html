<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16204F">
<meta name="robots" content="noindex,nofollow">
<title>Como você escolhe a faculdade de Direito? · Pesquisa</title>
<meta name="description" content="Pesquisa rápida e anônima para estudantes do 3º ano, do cursinho e de Direito.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@1,300;1,400&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="assets/simbolo_branco.png">
<style>
:root{
  --navy:#1D2A61;--navy2:#16204F;--navy3:#26357A;--off:#F4F4F2;--mint:#7FB9A8;--soft:#AEB4D4;
  --line:rgba(244,244,242,.16);--glass:rgba(244,244,242,.06);--glass2:rgba(244,244,242,.11);
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Montserrat',system-ui,sans-serif;background:var(--navy2);color:var(--off);min-height:100vh;min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
em,.it{font-family:'Merriweather',Georgia,serif;font-style:italic;font-weight:300;color:var(--mint)}
:focus-visible{outline:3px solid var(--mint);outline-offset:3px;border-radius:8px}

/* ---------- fundo vivo ---------- */
.bg{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none;background:radial-gradient(1200px 700px at 78% -10%,var(--navy3),transparent 60%),radial-gradient(900px 600px at -10% 110%,#1b2a6b,transparent 55%),var(--navy2)}
.bg .dots{position:absolute;inset:0;background-image:radial-gradient(rgba(244,244,242,.10) 1.2px,transparent 1.3px);background-size:34px 34px;mask-image:radial-gradient(circle at 70% 40%,#000 0,transparent 70%);-webkit-mask-image:radial-gradient(circle at 70% 40%,#000 0,transparent 70%)}
.dm{position:absolute;border:1.5px solid rgba(127,185,168,.30);transform:rotate(45deg);transition:transform .9s var(--ease)}
.dm.a{width:62vmin;height:62vmin;right:-18vmin;top:-14vmin;animation:spin 90s linear infinite}
.dm.b{width:34vmin;height:34vmin;left:-8vmin;bottom:8vmin;border-color:rgba(244,244,242,.14);animation:spin 120s linear infinite reverse}
.dm.c{width:14vmin;height:14vmin;right:12vmin;bottom:14vmin;background:rgba(127,185,168,.10);border-color:transparent;animation:float 9s ease-in-out infinite}
.blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.5}
.blob.a{width:46vmin;height:46vmin;background:#2c3f9a;left:20vmin;top:6vmin;animation:float 14s ease-in-out infinite}
.blob.b{width:34vmin;height:34vmin;background:rgba(127,185,168,.28);right:8vmin;bottom:-6vmin;animation:float 11s ease-in-out infinite reverse}
@keyframes spin{to{transform:rotate(405deg)}}
@keyframes float{50%{transform:translateY(-3vmin) rotate(45deg)}}
.blob.a,.blob.b{animation-name:floatb}@keyframes floatb{50%{transform:translate(2vmin,-3vmin)}}

/* ---------- casca ---------- */
.app{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr auto}
.top{display:flex;align-items:center;gap:16px;padding:max(16px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) 12px max(20px,env(safe-area-inset-left))}
.top img{height:38px;width:auto;display:block}
.top .sec{margin-left:auto;font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;color:var(--soft);text-align:right}
.bar{position:fixed;left:0;right:0;top:0;height:4px;background:rgba(244,244,242,.08);z-index:5}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mint),#b9ddd1);border-radius:0 4px 4px 0;box-shadow:0 0 18px rgba(127,185,168,.8);transition:width .8s var(--ease)}
.rail{display:none}
.main{display:grid;place-items:center;padding:8px max(20px,env(safe-area-inset-right)) 24px max(20px,env(safe-area-inset-left))}
#stage{width:100%;max-width:860px;justify-self:center}#stage:focus{outline:none}
.step{width:100%;animation:in .7s var(--ease) both}
.step.back{animation-name:inb}
@keyframes in{from{opacity:0;transform:translateY(26px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes inb{from{opacity:0;transform:translateY(-22px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.eyebrow{display:flex;align-items:center;gap:12px;font-size:12px;letter-spacing:.22em;text-transform:uppercase;font-weight:700;color:var(--mint);margin-bottom:18px}
.eyebrow::before{content:"";width:9px;height:9px;background:var(--mint);transform:rotate(45deg);flex:none}
.eyebrow span{color:var(--soft);font-weight:600}
h1.q{font-size:clamp(25px,4.1vw,46px);line-height:1.16;font-weight:800;letter-spacing:-.012em;text-wrap:balance}
.hint{margin-top:14px;font-size:clamp(14px,1.6vw,17px);line-height:1.55;color:var(--soft);font-weight:400;max-width:62ch}
.body{margin-top:clamp(22px,3.6vh,36px)}
.err{min-height:22px;margin-top:14px;font-size:14px;font-weight:600;color:var(--off)}
.err b{display:inline-block;background:rgba(244,244,242,.14);border:1px solid var(--line);padding:5px 12px;border-radius:99px;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ---------- opções ---------- */
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr))}
.opt{position:relative;display:flex;align-items:center;gap:14px;text-align:left;padding:15px 18px;border-radius:14px;background:var(--glass);border:1.5px solid var(--line);font-size:clamp(15px,1.7vw,18px);font-weight:500;line-height:1.35;transition:transform .25s var(--ease),background .25s,border-color .25s,box-shadow .25s;animation:rise .55s var(--ease) both;animation-delay:calc(var(--i,0)*45ms + 180ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.opt:hover{background:var(--glass2);transform:translateY(-2px);border-color:rgba(127,185,168,.6)}
.opt .k{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:700;letter-spacing:.04em;border:1.5px solid rgba(244,244,242,.35);color:var(--soft);transition:.25s}
.opt .lb{flex:1}
.opt .ck{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid rgba(244,244,242,.3);display:grid;place-items:center;transition:.25s}
.opt .ck svg{width:14px;height:14px;stroke:var(--navy);stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .4s var(--ease) .05s}
.opt.on{background:var(--mint);border-color:var(--mint);color:var(--navy);font-weight:700;box-shadow:0 10px 30px -10px rgba(127,185,168,.7);transform:translateY(-2px)}
.opt.on .k{background:var(--navy);border-color:var(--navy);color:var(--off)}
.opt.on .ck{background:var(--navy);border-color:var(--navy)}
.opt.on .ck svg{stroke:var(--mint);stroke-dashoffset:0}
.opt.multi .ck{border-radius:7px}
.opt .rk{flex:none;width:34px;height:34px;border-radius:10px;border:1.5px dashed rgba(244,244,242,.35);display:grid;place-items:center;font-weight:800;font-size:16px;transition:.25s}
.opt.on .rk{border-style:solid;background:var(--navy);border-color:var(--navy);color:var(--mint)}
.other{margin-top:10px}
.txt,.ta{width:100%;background:rgba(244,244,242,.08);border:1.5px solid var(--line);border-radius:14px;padding:15px 18px;font-size:clamp(16px,1.8vw,19px);line-height:1.5;transition:border-color .25s,background .25s;resize:vertical}
.txt:focus,.ta:focus{outline:none;border-color:var(--mint);background:rgba(244,244,242,.12)}
.txt::placeholder,.ta::placeholder{color:rgba(174,180,212,.7)}
.ta{min-height:130px}
.cnt{margin-top:8px;font-size:12px;color:var(--soft);text-align:right;letter-spacing:.06em}
.lab{display:block;margin:18px 0 8px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--soft)}
.lab:first-child{margin-top:0}
.fields{display:grid;gap:12px}
.field{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center}
.field b{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--glass2);font-weight:800;color:var(--mint)}

/* ---------- escala ---------- */
.scale{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:8px}
.sc{aspect-ratio:1/1.05;border-radius:14px;background:var(--glass);border:1.5px solid var(--line);font-size:clamp(16px,2.4vw,24px);font-weight:700;display:grid;place-items:center;transition:.25s var(--ease);animation:rise .5s var(--ease) both;animation-delay:calc(var(--i)*35ms + 160ms)}
.sc:hover{transform:translateY(-4px);background:var(--glass2);border-color:var(--mint)}
.sc.on{background:var(--mint);color:var(--navy);border-color:var(--mint);transform:translateY(-6px) scale(1.06);box-shadow:0 14px 34px -10px rgba(127,185,168,.8)}
.sc.low{opacity:.9}
.ends{display:flex;justify-content:space-between;gap:16px;margin-top:14px;font-size:13px;color:var(--soft);font-weight:500}
.ends span:last-child{text-align:right}
@media (max-width:560px){.scale[style*="--n:11"]{grid-template-columns:repeat(6,1fr)}.sc{aspect-ratio:1/1}}

/* ---------- grades ---------- */
.grid{display:grid;gap:14px}
.gr{background:var(--glass);border:1.5px solid var(--line);border-radius:16px;padding:16px 18px 18px;animation:rise .55s var(--ease) both;animation-delay:calc(var(--i)*60ms + 180ms)}
.gr.done{border-color:rgba(127,185,168,.55)}
.gr p{font-size:clamp(15px,1.7vw,18px);font-weight:600;line-height:1.4;margin-bottom:12px}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.chip{border-radius:11px;padding:11px 4px 9px;text-align:center;background:rgba(244,244,242,.07);border:1.5px solid var(--line);transition:.22s var(--ease);display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.chip:hover{background:var(--glass2);border-color:var(--mint);transform:translateY(-2px)}
.chip b{font-size:17px;font-weight:800}
.chip small{font-size:10.5px;line-height:1.2;color:var(--soft);font-weight:500;letter-spacing:.01em}
.chip.on{background:var(--mint);border-color:var(--mint);color:var(--navy);transform:translateY(-3px);box-shadow:0 10px 24px -10px rgba(127,185,168,.8)}
.chip.on small{color:var(--navy);font-weight:700}
@media (max-width:620px){.chip small{display:none}.chip{padding:12px 2px}}
.gends{display:none;justify-content:space-between;margin-top:8px;font-size:11.5px;color:var(--soft)}
@media (max-width:620px){.gends{display:flex}}

/* ---------- assoc ---------- */
.as{background:var(--glass);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px 16px;animation:rise .55s var(--ease) both;animation-delay:calc(var(--i)*60ms + 180ms)}
.as p{font-size:14px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--mint);margin-bottom:10px}
.sug{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sug button{font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:99px;border:1.5px solid var(--line);color:var(--soft);transition:.2s}
.sug button:hover{border-color:var(--mint);color:var(--off)}

/* ---------- telas especiais ---------- */
.hero{max-width:900px}
.hero h1{font-size:clamp(34px,6.6vw,72px);line-height:1.04;font-weight:800;letter-spacing:-.02em}
.hero .lead{margin-top:22px;font-size:clamp(16px,2vw,21px);line-height:1.55;color:var(--soft);max-width:56ch}
.pills{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.pill{display:flex;align-items:center;gap:9px;padding:9px 16px;border-radius:99px;border:1.5px solid var(--line);background:var(--glass);font-size:14px;font-weight:600}
.pill i{width:8px;height:8px;background:var(--mint);transform:rotate(45deg)}
.consent ul{list-style:none;display:grid;gap:12px;margin-top:6px}
.consent li{display:grid;grid-template-columns:22px 1fr;gap:12px;font-size:clamp(15px,1.7vw,18px);line-height:1.5;color:var(--off);animation:rise .55s var(--ease) both;animation-delay:calc(var(--i)*70ms + 200ms)}
.consent li::before{content:"";width:10px;height:10px;background:var(--mint);transform:rotate(45deg);margin-top:8px;justify-self:center}
.consent a{color:var(--mint)}
.fine{margin-top:20px;font-size:13px;color:var(--soft);line-height:1.6;max-width:70ch}
.reveal{position:fixed;inset:0;z-index:4;display:grid;place-items:center;text-align:center;padding:30px;background:linear-gradient(180deg,rgba(22,32,79,.82),rgba(29,42,97,.94)),url(assets/students.jpg) center/cover;animation:fade .8s both}
@keyframes fade{from{opacity:0}}
.reveal .in{max-width:760px;animation:in .9s var(--ease) .2s both}
.reveal img{height:clamp(110px,22vh,190px);width:auto;max-width:78%;margin-bottom:26px}
.reveal h2{font-size:clamp(24px,4vw,44px);line-height:1.2;font-weight:800;text-wrap:balance}
.reveal p{margin:16px auto 0;color:var(--soft);font-size:clamp(15px,1.8vw,19px);line-height:1.6;max-width:52ch}
.reveal .go{margin-top:34px}
.cardp{position:relative;overflow:hidden;border-radius:22px;border:1.5px solid rgba(127,185,168,.5);background:linear-gradient(135deg,rgba(244,244,242,.10),rgba(244,244,242,.04));padding:clamp(24px,4vw,44px);box-shadow:0 30px 80px -30px rgba(0,0,0,.35)}
.cardp::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border:1.5px solid rgba(127,185,168,.35);transform:rotate(45deg)}
.cardp small{display:block;font-size:12px;letter-spacing:.22em;text-transform:uppercase;font-weight:700;color:var(--mint);margin-bottom:16px}
.cardp h2{font-size:clamp(24px,4vw,40px);font-weight:800;line-height:1.15}
.cardp p{margin-top:16px;font-size:clamp(17px,2.2vw,23px);line-height:1.6;font-weight:300;max-width:50ch;position:relative;z-index:1}
.again{margin-bottom:20px}
.again summary{cursor:pointer;display:inline-flex;align-items:center;gap:10px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--mint);padding:8px 14px;border-radius:99px;border:1.5px solid rgba(127,185,168,.45);list-style:none}
.again summary::-webkit-details-marker{display:none}
.again p{margin-top:12px;padding:16px 18px;border-radius:14px;background:var(--glass);border-left:4px solid var(--mint);font-size:15px;line-height:1.6;color:var(--off)}
.end{text-align:center;max-width:720px;margin:0 auto}
.end .seal{width:104px;height:104px;margin:0 auto 28px;position:relative}
.end .seal i{position:absolute;inset:14px;border:2px solid var(--mint);transform:rotate(45deg);animation:pop .8s var(--ease) both}
.end .seal i:nth-child(2){inset:0;border-color:rgba(244,244,242,.25);animation-delay:.15s}
.end .seal svg{position:absolute;inset:0;margin:auto;width:46px;height:46px;stroke:var(--mint);stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:50;stroke-dashoffset:50;animation:draw .7s var(--ease) .5s forwards}
@keyframes pop{from{transform:rotate(0) scale(.2);opacity:0}}
@keyframes draw{to{stroke-dashoffset:0}}
.end h1{font-size:clamp(30px,5.2vw,56px);line-height:1.1;font-weight:800}
.end p{margin-top:18px;color:var(--soft);font-size:clamp(15px,1.9vw,19px);line-height:1.6}
.share{margin-top:30px;padding:22px;border-radius:18px;background:var(--glass);border:1.5px solid var(--line);text-align:left}
.share b{display:block;font-size:16px;margin-bottom:6px}
.share span{display:block;font-size:14px;color:var(--soft);line-height:1.55}
.share .btn{margin-top:16px}
.spin{width:44px;height:44px;border:3px solid rgba(244,244,242,.2);border-top-color:var(--mint);border-radius:50%;animation:rot 1s linear infinite;margin:0 auto 22px}
@keyframes rot{to{transform:rotate(360deg)}}
.demo{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:9;background:var(--off);color:var(--navy);font-size:12px;font-weight:700;letter-spacing:.06em;padding:7px 14px;border-radius:99px;box-shadow:0 10px 30px rgba(0,0,0,.25)}

/* ---------- navegação ---------- */
.nav{position:sticky;bottom:0;display:flex;align-items:center;gap:14px;padding:14px max(20px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));background:linear-gradient(180deg,transparent,rgba(22,32,79,.92) 40%);z-index:6}
.nav .sp{flex:1}
.nav .kb{font-size:12px;color:var(--soft);letter-spacing:.06em;display:none}
.btn{display:inline-flex;align-items:center;gap:12px;padding:15px 28px;border-radius:99px;font-weight:700;font-size:16px;letter-spacing:.02em;transition:transform .25s var(--ease),box-shadow .25s,background .25s,opacity .25s}
.btn.pri{background:var(--mint);color:var(--navy);box-shadow:0 14px 34px -12px rgba(127,185,168,.85)}
.btn.pri:hover:not(:disabled){transform:translateY(-2px) scale(1.02);box-shadow:0 18px 40px -10px rgba(127,185,168,.95)}
.btn.pri:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
.btn.pri svg{width:18px;height:18px;stroke:var(--navy);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s}
.btn.pri:hover:not(:disabled) svg{transform:translateX(4px)}
.btn.gh{border:1.5px solid var(--line);color:var(--soft);padding:13px 22px;font-size:14px}
.btn.gh:hover{color:var(--off);border-color:var(--soft)}
.btn[hidden],.kb[hidden]{display:none!important}
.bp{position:relative;z-index:1}

@media (min-width:1040px){
  .app{grid-template-columns:260px minmax(0,1fr)}
  .top{grid-column:1/-1}
  .rail{display:block;grid-row:2/4;padding:30px 0 30px max(28px,env(safe-area-inset-left))}
  .rail ol{list-style:none;position:relative;display:grid;gap:4px}
  .rail ol::before{content:"";position:absolute;left:8px;top:10px;bottom:10px;width:1.5px;background:var(--line)}
  .rail li{position:relative;display:flex;align-items:center;gap:16px;padding:9px 0;font-size:13px;font-weight:600;color:rgba(174,180,212,.55);letter-spacing:.03em;transition:color .4s}
  .rail li i{position:relative;width:17px;height:17px;border:1.5px solid rgba(174,180,212,.5);background:var(--navy2);transform:rotate(45deg) scale(.72);transition:.4s var(--ease);flex:none}
  .rail li.done{color:var(--soft)}.rail li.done i{background:var(--mint);border-color:var(--mint)}
  .rail li.cur{color:var(--off);font-weight:800}.rail li.cur i{background:var(--navy2);border-color:var(--mint);transform:rotate(45deg) scale(1);box-shadow:0 0 0 5px rgba(127,185,168,.18)}
  .nav{grid-column:2}
  .nav .kb{display:block}
  .main{grid-column:2;padding-right:60px}
  .top .sec{display:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}}
.chips{grid-template-columns:repeat(var(--c,5),1fr)}
.mrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mrow .box{position:relative;flex:1;min-width:150px;max-width:260px}
.mrow .box span{position:absolute;left:18px;top:50%;transform:translateY(-50%);font-weight:700;color:var(--mint)}
.mrow .box input{padding-left:50px}
.chip2{font-size:13.5px;font-weight:600;padding:12px 18px;border-radius:99px;border:1.5px solid var(--line);color:var(--soft);transition:.2s}
.chip2:hover{border-color:var(--mint);color:var(--off)}
.chip2.on{background:var(--mint);color:var(--navy);border-color:var(--mint);font-weight:700}
.mrow+.lab{margin-top:22px}
.bits{position:fixed;inset:0;pointer-events:none;z-index:8;overflow:hidden}
.bit{position:absolute;width:12px;height:12px;background:var(--mint);transform:rotate(45deg);animation:bit 1.6s cubic-bezier(.2,.7,.3,1) forwards;opacity:0}
.bit:nth-child(3n){background:var(--off);width:8px;height:8px}
@keyframes bit{0%{opacity:1;transform:translate(0,0) rotate(45deg)}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(405deg)}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><div class="dots"></div><div class="blob a"></div><div class="blob b"></div><div class="dm a"></div><div class="dm b"></div><div class="dm c"></div></div>
